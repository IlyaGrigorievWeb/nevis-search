version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nevissearch-postgres
    environment:
      POSTGRES_DB: searchdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-schema.sql:/docker-entrypoint-initdb.d/database-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d searchdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nevissearch-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override host from application.yml so it can talk to the db service
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/searchdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8080:8080"

volumes:
  postgres_data: